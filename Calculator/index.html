<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="calculator">
    <!-- Display -->
    <div class="display-wrapper">
      <div class="solar-panel">
        <div class="solar-cell"></div>
        <div class="solar-cell"></div>
        <div class="solar-cell"></div>
        <div class="solar-cell"></div>
        <div class="solar-cell"></div>
        <div class="solar-cell"></div>
      </div>
      <div class="display">
        <div class="expression" id="expression"></div>
        <div class="result" id="result">0</div>
      </div>
    </div>

    <!-- Buttons -->
    <div class="buttons">
      <!-- Row 1: Memory -->
      <button class="btn mem" data-action="mc">MC</button>
      <button class="btn mem" data-action="mr">MR</button>
      <button class="btn mem" data-action="m-">M-</button>
      <button class="btn mem" data-action="m+">M+</button>
      <button class="btn clear" data-action="clear">ON/C</button>

      <!-- Row 2 -->
      <button class="btn num" data-value="7">7</button>
      <button class="btn num" data-value="8">8</button>
      <button class="btn num" data-value="9">9</button>
      <button class="btn op-light" data-action="backspace">⌫</button>
      <button class="btn op" data-value="÷">÷</button>

      <!-- Row 3 -->
      <button class="btn num" data-value="4">4</button>
      <button class="btn num" data-value="5">5</button>
      <button class="btn num" data-value="6">6</button>
      <button class="btn op-light" data-action="percent">%</button>
      <button class="btn op" data-value="×">×</button>

      <!-- Row 4 -->
      <button class="btn num" data-value="1">1</button>
      <button class="btn num" data-value="2">2</button>
      <button class="btn num" data-value="3">3</button>
      <button class="btn op-light" data-action="sign">+/-</button>
      <button class="btn op" data-value="−">−</button>

      <!-- Row 5 -->
      <button class="btn num wide" data-value="0">0</button>
      <button class="btn num" data-value="00">00</button>
      <button class="btn num" data-value=".">.</button>
      <button class="btn equals" data-action="equals">=</button>
      <button class="btn op" data-value="+">+</button>
    </div>
  </div>

  <script src="calculator.js"></script>
</body>
</html>
